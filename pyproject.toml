[project]
name = "yoruu"
version = "0.3.0"
description = "Polymarket BTC 5min bot — Markov + Kelly, paper-first core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0.1",
    "click>=8.1.0",
]

[project.scripts]
yoruu = "yoruu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoruu"]

[tool.hatch.build.targets.sdist]
packages = ["src/yoruu"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=yoruu --cov-report=term-missing"
markers = [
    "paper: paper execution tests",
    "invariant: invariant tests",
]

[tool.coverage.run]
source = ["yoruu"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 50
