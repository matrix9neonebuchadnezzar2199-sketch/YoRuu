name: mock-locales

on:
  pull_request:
    paths:
      - "docs/mockups/shared/locales/**"
      - "tools/build_locales.py"
  push:
    branches: [main]
    paths:
      - "docs/mockups/shared/locales/**"
      - "tools/build_locales.py"

jobs:
  locale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ja/en locale key parity
        run: python tools/build_locales.py --check
